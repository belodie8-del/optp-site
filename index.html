<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Cartable du Manager • Mise à jour en cours</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(148deg,#0F868A 0%,#085055 100%);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  max-width:560px;
  text-align:center;
}
.icon{font-size:56px;margin-bottom:18px;}
h1{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:clamp(26px,5vw,38px);
  line-height:1.2;
  margin:0 0 16px;
}
p{
  font-size:17px;
  line-height:1.6;
  opacity:.9;
  margin:0 0 10px;
}
.badge{
  display:inline-block;
  background:#FF914D;
  color:#fff;
  font-size:13.5px;
  font-weight:800;
  padding:7px 18px;
  border-radius:12px;
  margin-top:20px;
}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🎒</div>
    <h1>On met à jour le Cartable du Manager</h1>
    <p>Le site est en cours de mise à jour. On revient très vite avec du nouveau !</p>
    <div class="badge">Merci de ta patience</div>
  </div>
</body>
</html>
